<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hungry Birds Map</title>
  <link
    rel="icon"
    type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23f97316'/%3E%3Ctext x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' font-family='Arial,sans-serif' font-weight='bold' font-size='28' fill='white'%3EHB%3C/text%3E%3C/svg%3E"
  />
  <link rel="stylesheet" href="styles.css" />
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #fff7ed;
      font-family: Arial, sans-serif;
    }
    .card {
      width: min(96vw, 900px);
      background: white;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(15, 23, 42, 0.12);
      border: 1px solid #fed7aa;
    }
    iframe {
      width: 100%;
      height: 500px;
      border: 0;
      display: block;
    }
  </style>
</head>
<body>
  <div class="card">
    <iframe
      title="Hungry Birds Restaurant Location Map"
      src="https://www.google.com/maps?q=Hungry%20Birds&output=embed"
      loading="lazy"
      referrerpolicy="no-referrer-when-downgrade"
      allowfullscreen>
    </iframe>
  </div>
</body>
</html>
