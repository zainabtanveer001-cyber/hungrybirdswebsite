<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hungry Birds Map</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #fff7ed;
      font-family: Arial, sans-serif;
    }
    .card {
      width: min(96vw, 900px);
      background: white;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(15, 23, 42, 0.12);
      border: 1px solid #fed7aa;
    }
    iframe {
      width: 100%;
      height: 500px;
      border: 0;
      display: block;
    }
  </style>
</head>
<body>
  <div class="card">
    <iframe
      src="https://www.google.com/maps?q=Hungry%20Birds&output=embed"
      loading="lazy"
      referrerpolicy="no-referrer-when-downgrade"
      allowfullscreen>
    </iframe>
  </div>
</body>
</html>
