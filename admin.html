<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hungry Birds - Coupon Admin</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-gray-50 min-h-screen text-gray-800">

    <!-- Sign-in gate -->
    <div id="loginScreen" class="min-h-screen flex items-center justify-center p-4">
        <form id="adminLoginForm" class="bg-white rounded-3xl shadow-lg p-8 w-full max-w-sm space-y-4">
            <h1 class="text-xl font-black text-center">Admin Sign In</h1>

            <input
                type="email"
                id="adminEmail"
                placeholder="Email"
                required
                class="w-full px-4 py-3 rounded-2xl border border-gray-200 outline-none focus:ring-4 focus:ring-orange-100"
            >

            <input
                type="password"
                id="adminPassword"
                placeholder="Password"
                required
                class="w-full px-4 py-3 rounded-2xl border border-gray-200 outline-none focus:ring-4 focus:ring-orange-100"
            >

            <button
                type="submit"
                class="w-full bg-gray-900 text-white font-bold py-3 rounded-2xl hover:bg-orange-500 transition-colors"
            >
                Sign In
            </button>

            <p id="adminLoginError" class="text-sm text-red-500 hidden"></p>
        </form>
    </div>

    <!-- Access denied -->
    <div id="deniedScreen" class="hidden min-h-screen flex flex-col items-center justify-center p-4 text-center gap-4">
        <i class="fa-solid fa-lock text-4xl text-red-400"></i>
        <h1 class="text-xl font-black">Access Denied</h1>
        <p class="text-gray-500">This account is not authorized to manage coupons.</p>
        <button id="deniedSignOutBtn" class="px-5 py-2.5 rounded-xl bg-gray-900 text-white font-bold hover:bg-orange-500">
            Sign Out
        </button>
    </div>

    <!-- Admin panel -->
    <div id="adminPanel" class="hidden max-w-7xl mx-auto p-6 space-y-8">

        <div class="flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-black">Admin Dashboard</h1>
                <p class="text-sm text-gray-500 mt-1">Customers, online orders, and coupons</p>
            </div>
            <div class="flex items-center gap-2">
                <button id="refreshAdminDataBtn" title="Refresh customer and order data" class="w-10 h-10 rounded-xl bg-gray-100 hover:bg-gray-200" aria-label="Refresh customer and order data">
                    <i class="fa-solid fa-rotate-right"></i>
                </button>
                <button id="adminSignOutBtn" class="text-sm bg-gray-100 px-4 py-2 rounded-full hover:bg-gray-200">
                    Sign Out
                </button>
            </div>
        </div>

        <!-- Customers -->
        <section class="bg-white rounded-3xl shadow-sm border border-gray-100 p-6">
            <div class="flex justify-between items-center mb-4 gap-4">
                <div>
                    <h2 class="font-bold text-lg">Customers</h2>
                    <p id="customersSummary" class="text-sm text-gray-500"></p>
                </div>
            </div>
            <div id="customersTable" class="space-y-3"></div>
        </section>

        <!-- Orders -->
        <section class="bg-white rounded-3xl shadow-sm border border-gray-100 p-6">
            <div class="mb-4">
                <h2 class="font-bold text-lg">Online Orders</h2>
                <p id="ordersSummary" class="text-sm text-gray-500"></p>
            </div>
            <div id="ordersTable" class="space-y-3"></div>
        </section>

        <!-- Create coupon -->
        <form id="couponForm" class="bg-white rounded-3xl shadow-sm border border-gray-100 p-6 grid gap-4 sm:grid-cols-2">
            <h2 class="sm:col-span-2 font-bold text-lg">Create Coupon</h2>

            <input
                type="text"
                id="couponCodeField"
                placeholder="Coupon code (e.g. SAVE20)"
                required
                class="px-4 py-3 rounded-2xl border border-gray-200 uppercase outline-none focus:ring-4 focus:ring-orange-100"
            >

            <input
                type="number"
                id="couponDiscountField"
                placeholder="Discount %"
                min="1"
                max="100"
                required
                class="px-4 py-3 rounded-2xl border border-gray-200 outline-none focus:ring-4 focus:ring-orange-100"
            >

            <select
                id="couponTypeField"
                class="px-4 py-3 rounded-2xl border border-gray-200 outline-none focus:ring-4 focus:ring-orange-100"
            >
                <option value="promo">Promo (public)</option>
                <option value="loyalty">Loyalty (assigned user)</option>
            </select>

            <input
                type="email"
                id="couponAssignedEmailField"
                placeholder="Assigned user email (optional)"
                class="px-4 py-3 rounded-2xl border border-gray-200 outline-none focus:ring-4 focus:ring-orange-100"
            >

            <input
                type="number"
                id="couponMaxUsesField"
                placeholder="Max uses (optional, promo only)"
                min="1"
                class="px-4 py-3 rounded-2xl border border-gray-200 outline-none focus:ring-4 focus:ring-orange-100"
            >

            <input
                type="date"
                id="couponExpiryField"
                class="px-4 py-3 rounded-2xl border border-gray-200 outline-none focus:ring-4 focus:ring-orange-100"
            >

            <button
                type="submit"
                class="sm:col-span-2 bg-orange-500 text-white font-bold py-3 rounded-2xl hover:bg-orange-600 transition-colors"
            >
                Create Coupon
            </button>

            <p id="couponFormMessage" class="sm:col-span-2 text-sm hidden"></p>
        </form>

        <!-- Existing coupons -->
        <div class="bg-white rounded-3xl shadow-sm border border-gray-100 p-6">
            <h2 class="font-bold text-lg mb-4">Existing Coupons</h2>

            <div id="couponsTable" class="space-y-2"></div>
        </div>

    </div>

    <script type="module" src="adminwebsite.js"></script>

</body>

</html>
